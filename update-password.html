<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkive — Set a new password</title>
  <link rel="stylesheet" href="./assets/tokens.css?v=ws7">
  <style>
    .login-wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 48px 24px;
    }
    .login-card { width: 100%; max-width: 420px; padding: 44px 40px 36px; margin-top: 40px; }
    .login-head { text-align: center; }
    .login-head h1 { margin-top: 18px; }
    .login-sub { color: var(--ink-soft); margin-top: 10px; font-size: 16px; }
    .login-form { margin-top: 8px; }
    .login-form .form-row { margin-top: 18px; }
    .login-form .error-text { margin-top: 14px; text-align: center; }
    .login-form .btn-primary { width: 100%; margin-top: 20px; }
    .success-text { color: var(--ink); font-size: 15px; line-height: 1.6; text-align: center; margin-top: 14px; }
    .state-note { text-align: center; color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body hidden>
  <div class="login-wrap">
    <div class="login-head">
      <div class="wordmark">Arkive</div>
      <h1>Set a new password.</h1>
      <p class="login-sub">Choose a new password for your Arkive.</p>
    </div>

    <div class="card login-card" id="card">
      <!-- waiting for the recovery session to resolve -->
      <p class="state-note" id="resolving">Verifying your reset link…</p>

      <!-- recovery session present → set new password -->
      <form class="login-form" id="form" hidden novalidate>
        <div class="form-row">
          <label class="field-label" for="password">New password</label>
          <input class="field" id="password" type="password" autocomplete="new-password" required>
        </div>
        <p class="error-text" id="error" role="alert" aria-live="polite"></p>
        <button class="btn btn-primary" id="submit" type="submit">Update Password</button>
      </form>

      <p class="success-text" id="success" role="status" aria-live="polite" hidden>Your password is updated. Taking you to your Arkive…</p>

      <!-- no recovery session (link expired / opened cold) -->
      <div id="invalid" hidden>
        <p class="state-note">This reset link has expired or was already used.</p>
        <p class="actions" style="margin-top:22px;text-align:center">
          <a class="btn btn-quiet" href="./index.html">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./assets/arkive.js?v=ws7";

    document.body.removeAttribute("hidden");
    const resolving = document.getElementById("resolving");
    const form = document.getElementById("form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit");
    const successEl = document.getElementById("success");
    const invalidEl = document.getElementById("invalid");

    // Race-safe: arm the auth listener AND read the current session
    // together, resolving on whichever yields a session first. The
    // detectSessionInUrl recovery exchange may land just after load, so we
    // must not lose an event fired between a getSession() and a later
    // listener registration. 5s timeout → treat as an expired/cold link.
    const session = await new Promise((resolve) => {
      const timer = setTimeout(() => resolve(null), 5000);
      const settle = (s) => { if (s) { clearTimeout(timer); resolve(s); } };
      supabase.auth.onAuthStateChange((_event, s) => settle(s));
      supabase.auth.getSession().then(({ data }) => settle(data.session));
    });

    resolving.hidden = true;
    if (!session) {
      invalidEl.hidden = false;
    } else {
      form.hidden = false;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.textContent = "";
        const password = document.getElementById("password").value;
        if (!password || password.length < 8) { errorEl.textContent = "Use at least 8 characters."; return; }
        submitBtn.disabled = true; submitBtn.textContent = "Updating…";
        try {
          const { error } = await supabase.auth.updateUser({ password });
          if (error) { errorEl.textContent = "Couldn’t update the password — try requesting a fresh link."; return; }
          form.hidden = true;
          successEl.hidden = false;
          setTimeout(() => window.location.replace("./capsules.html"), 1400);
        } catch (err) {
          console.error("arkive: password update failed", err);
          errorEl.textContent = "Can’t reach Arkive right now — try again.";
        } finally {
          submitBtn.disabled = false; submitBtn.textContent = "Update Password";
        }
      });
    }
  </script>
</body>
</html>
